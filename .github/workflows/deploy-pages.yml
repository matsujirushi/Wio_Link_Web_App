name: Deploy Blazor WebAssembly to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Publish
        run: dotnet publish WioLinkWebApp.csproj --configuration Release --output ./publish

      - name: Configure GitHub Pages base path
        run: sed -i 's#<base href="/" />#<base href="/Wio_Link_Web_App/" />#' publish/wwwroot/index.html

      - name: Configure SPA fallback
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Disable Jekyll processing
        run: touch publish/wwwroot/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
